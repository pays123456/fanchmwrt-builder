name: Build GL-MT3600BE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  SOURCE_REPO: openwrt/openwrt
  SOURCE_BRANCH: v25.12.5
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: glinet_gl-mt3600be
  TERM: vt100   # 保险：防止其他工具误判终端

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl time subversion libncurses5-dev libpam0g-dev

      - name: Prepare source
        run: bash scripts/prepare-source.sh "$GITHUB_WORKSPACE/source"

      - name: Configure (no menuconfig)
        run: |
          cd "$GITHUB_WORKSPACE/source"

          # 1. 写入目标设备和架构
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt3600be=y
          EOF

          # 2. 追加 FanchmWrt 核心包
          echo "CONFIG_PACKAGE_luci-app-fanchm=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_kmod-netfilter-openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-fanchm=y" >> .config

          # 3. 合并你的 base.config（如果存在）
          cat "$GITHUB_WORKSPACE/configs/base.config" >> .config || true

          # 4. 自动展开完整配置（绝不弹出菜单）
          make defconfig V=s

      - name: Clean old artifacts
        run: |
          cd "$GITHUB_WORKSPACE/source"
          make distclean || true

      - name: Build
        run: cd source && make -j1 V=s

      - name: Verify artifacts
        run: bash scripts/verify-build.sh source "$TARGET" "$SUBTARGET" "$PROFILE"

      - name: Collect artifacts
        run: bash scripts/collect-artifacts.sh source "$TARGET" "$SUBTARGET" artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt3600be
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          

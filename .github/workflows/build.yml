name: Build GL-MT3600BE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  SOURCE_REPO: openwrt/openwrt
  SOURCE_BRANCH: v25.12.5
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: glinet_gl-mt3600be

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: source
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl time subversion

      - name: Add FanchmWrt feeds
        run: |
          cd "$GITHUB_WORKSPACE/source"
          # 引入 FanchmWrt 官方特色包源（包含 openappfilter 等核心包）
          echo "src-git fanchmwrt https://github.com/fanchmwrt/fanchmwrt-packages;main" >> feeds.conf.default
          # 如果你的账号下还有自定义修改的包，取消下面这行的注释：
          # echo "src-git pays https://github.com/pays123456/fanchmwrt-packages.git;main" >> feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare source
        run: bash scripts/prepare-source.sh source

      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/source"
          # 复制基础配置
          cp "$GITHUB_WORKSPACE/configs/base.config" .config
          
          # ===================== FanchmWrt 核心特色包【必须保留】 =====================
          echo "CONFIG_PACKAGE_luci-app-fanchm=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_kmod-netfilter-openappfilter=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-fanchm=y" >> .config
          
          make defconfig

      - name: Build
        run: cd source && make -j$(nproc)

      - name: Verify artifacts
        run: bash scripts/verify-build.sh source "$TARGET" "$SUBTARGET" "$PROFILE"

      - name: Collect artifacts
        run: bash scripts/collect-artifacts.sh source "$TARGET" "$SUBTARGET" artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt3600be
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          
